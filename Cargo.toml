[package]
name = "yfiles"
version = "0.1.0"
edition = "2021"
authors = ["Avikalpa Kundu <avi@gour.top>"]
license = "GPL-3.0-or-later"
description = "Visual file manager for libyggterm mimicking KDE Dolphin & Windows Explorer"
repository = "https://github.com/yggdrasilhq/yfiles"

[dependencies]
anyhow = "1"
ytrace = { git = "https://github.com/yggdrasilhq/ytrace", branch = "main" }
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3"
dirs = "5"
libc = "0.2"
once_cell = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
walkdir = "2.5"
humansize = "2.1"
trash = "5.1"
mime_guess = "2.0"
