[package]
name = "yfiles"
version = "0.1.0"
edition = "2021"
authors = ["Avikalpa Kundu <avi@gour.top>"]
license = "GPL-3.0-or-later"
description = "Visual file manager for libyggterm mimicking KDE Dolphin & Windows Explorer"
repository = "https://github.com/yggdrasilhq/yfiles"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
tokio = { version = "1.37", features = ["full"] }
warp = "0.3"
walkdir = "2.5"
humansize = "2.1"
trash = "5.1"
